name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match '^refs/tags/v(\d+)\.(\d+)\.(\d+)$') {
            $base = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          } else {
            $base = "0.0.0"
          }
          $full = "$base.${{ github.run_number }}"
          "version=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "LICHLOADER_VERSION=$full"

      - name: Configure
        run: cmake -B build -A Win32 "-DLICHLOADER_VERSION=${{ steps.ver.outputs.version }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LichLoader
          path: |
            bin/LichLoader.exe
            bin/LichCore.dll
          if-no-files-found: error

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path bin/LichLoader.exe, bin/LichCore.dll -DestinationPath "LichLoader-${{ github.ref_name }}.zip" -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LichLoader-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
